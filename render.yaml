services:
  - type: web
    name: null-rush-tournaments
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CHALLONGE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GUILD_ID
        sync: false
      - key: CHALLONGE_MONTHLY_BUDGET
        value: "500"
      - key: PYTHON_VERSION
        value: "3.12"
