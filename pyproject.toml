[project]
name = "tournamentbot"
version = "0.1.0"
description = "Discord bot for organizing tournaments via the Challonge API"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.setuptools]
packages = ["challonge", "db", "cogs", "ui"]
py-modules = ["bot", "config", "services", "timeparse"]
